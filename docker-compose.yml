services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_ENV: production
    image: cfo-marketplace:latest
    ports:
      - "8091:8091"
    environment:
      CONTAINER_MODE: http
      OCTANE_SERVER: frankenphp
      # Migrations run on boot; seeders do NOT (they would push demo catalog/
      # sales data into the live database). Seed once, by hand, if you want it.
      RUNNING_MIGRATIONS: "true"
      RUNNING_MIGRATIONS_AND_SEEDERS: "false"
      WITH_SCHEDULER: "true"
      # App
      APP_NAME: "CFO"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:8091}
      # Postgres — credentials come from the local .env, never from this file.
      # DB_HOST defaults to the external host; when this container runs on the
      # same Docker network as the database, use the internal host instead
      # (projects_cfo-postgres / port 5432).
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: ${DB_SSLMODE:-prefer}
      # Queue / cache / session use the database by default
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
      # BunnyCDN — image uploads. Credentials come from the local .env.
      BUNNYCDN_STORAGE_ZONE: ${BUNNYCDN_STORAGE_ZONE}
      BUNNYCDN_API_KEY: ${BUNNYCDN_API_KEY}
      BUNNYCDN_REGION: ${BUNNYCDN_REGION:-}
      BUNNYCDN_HOST: ${BUNNYCDN_HOST:-storage.bunnycdn.com}
      BUNNYCDN_PULL_ZONE_URL: ${BUNNYCDN_PULL_ZONE_URL}
      BUNNYCDN_TOKEN_AUTH_KEY: ${BUNNYCDN_TOKEN_AUTH_KEY}
      BUNNYCDN_PREFIX: ${BUNNYCDN_PREFIX:-cfo}
      # Browser push. Blank keys simply leave push switched off.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Mail
      MAIL_MAILER: log
      MAIL_FROM_ADDRESS: hello@example.com
    restart: unless-stopped
