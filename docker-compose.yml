services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_ENV: production
    image: cfo-marketplace:latest
    ports:
      - "8081:8000"
    environment:
      CONTAINER_MODE: http
      OCTANE_SERVER: frankenphp
      RUNNING_MIGRATIONS_AND_SEEDERS: "true"
      WITH_SCHEDULER: "true"
      # App. APP_KEY is read from the local .env; everything else is pinned here
      # so the Laravel .env (dev values) cannot leak into the container.
      APP_NAME: "CFO Marketplace"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: http://localhost:8081
      # MySQL. Points at the bundled service below — swap these for a managed
      # DB's host/credentials when deploying.
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: marketplace_admin
      DB_USERNAME: marketplace
      DB_PASSWORD: secret
      # Queue / cache / session use the database by default
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
      # Mail
      MAIL_MAILER: log
      MAIL_FROM_ADDRESS: hello@example.com
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: marketplace_admin
      MYSQL_USER: marketplace
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql-data:
