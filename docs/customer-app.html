<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Clickable prototype of the CFO customer app — browse, cart, checkout, orders, returns. Hand this to whoever builds the shopper app, alongside docs/seller-app.html.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">
<title>CFO Shop — customer app prototype</title>
</head>
<body>

<style>
    /*
    | Sibling of docs/seller-app.html: same device shell, same screen/router
    | shape, same "one object per API resource" data. The skin is the shopper
    | one — a white app bar, a search field in it, price-first cards.
    |
    | Colour roles, so a change of mind stays a change of one token:
    |   ground     the blush the whole app sits on
    |   surface    white, and every card is one
    |   brand      pink — every call to action and every active state
    |   brand-soft the pale pink behind an active thing (the tab pill, chips)
    |   sale       orange — and only ever the discount percentage
    |   deal       green — and only ever money saved or delivery gone free
    |   teal       the rating chip
    |   critical   red — and only ever destructive
    |
    | One theme on purpose. A fashion app commits to its own light, and the
    | blush IS the brand here — so nothing follows the OS into dark, and every
    | colour below is painted explicitly rather than inherited from the host.
    */

    :root {
        --brand: #dd2f60;
        --brand-soft: #ffe7ed;
        --on-brand: #ffffff;
        --chrome: #feebe5;
        --chrome-ink: #282c3f;
        --ground: #feebe5;
        --surface: #ffffff;
        --surface-2: #fdf0e8;
        --line: #f4e2da;
        --line-soft: #f7ece6;
        --ink: #282c3f;
        --ink-2: #4d4d58;
        --ink-3: #6e6a72;
        --action: #cc1a4f;   /* the same pink, a shade down, so links clear 4.5:1 on the pale pink rows too */
        --deal: #016a57;   /* deep enough to hold 4.5:1 on the blush ground, not just on white */
        --deal-soft: #e3f7f1;
        --sale: #c0530f;
        --gold: #ffa53b;
        --teal: #0f7d78;
        --critical: #d0021b;
        --ok-bg: #e3f7f1; --ok-ink: #016450;
        --warn-bg: #fff3e4; --warn-ink: #8a4b12;
        --info-bg: #ffe7ed; --info-ink: #a01342;
        --crit-bg: #fdeced; --crit-ink: #a3121f;
        --page: #e8dcd6;
        --sans: "Roboto", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }

    body {
        margin: 0;
        background: var(--page);
        font-family: var(--sans);
        color: var(--ink);
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
    }

    /* --------------------------------------------------------- the device */

    .device {
        width: 390px; height: 844px;
        max-height: calc(100vh - 48px);
        border-radius: 46px;
        background: #0b0d10;
        padding: 11px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, .3), 0 30px 70px rgba(0, 0, 0, .35);
        flex-shrink: 0;
    }

    @media (max-width: 460px), (max-height: 700px) {
        body { padding: 0; display: block; }
        .device { width: 100%; height: 100vh; max-height: none; border-radius: 0; padding: 0; box-shadow: none; }
        .app { border-radius: 0 !important; }
        .deskhint { display: none; }
    }

    .app {
        position: relative; height: 100%;
        border-radius: 36px; overflow: hidden;
        background: var(--ground);
        display: flex; flex-direction: column;
    }

    /* ---------------------------------------------------------- app chrome */

    .statusbar {
        background: var(--chrome); color: var(--ink-3);
        font-size: 11px; font-family: var(--mono);
        display: flex; justify-content: space-between;
        padding: 10px 24px 3px; flex-shrink: 0;
    }

    /* No bar of its own: the chrome is the same blush the page sits on, and
       the pink is spent on what you can tap. */
    .appbar {
        background: var(--chrome); color: var(--chrome-ink);
        padding: 6px 8px 10px;
        display: flex; align-items: center; gap: 4px;
        flex-shrink: 0; min-height: 52px;
    }

    .appbar .titles { min-width: 0; flex: 1; padding-left: 4px; }
    .appbar .t, .appbar .s { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .appbar .t { font-size: 16.5px; font-weight: 500; letter-spacing: -.01em; }
    .appbar .s { font-size: 11.5px; color: var(--ink-3); margin-top: 1px; }

    /* The search field replaces the title on the shopping tabs — it is the
       one control that has to be reachable from anywhere. */
    .searchfield {
        flex: 1; min-width: 0;
        background: var(--surface); color: var(--ink-3);
        border: 1px solid rgba(40, 44, 63, .08); border-radius: 10px;
        height: 40px; padding: 0 12px;
        display: flex; align-items: center; gap: 9px;
        font-size: 13.5px; font-family: inherit;
        cursor: pointer; text-align: left;
    }

    .searchfield svg { width: 17px; height: 17px; fill: var(--ink-3); flex-shrink: 0; }
    .searchfield input { border: 0; background: transparent; font: inherit; color: var(--ink); width: 100%; outline: 0; }

    .iconbtn {
        width: 36px; height: 36px;
        display: grid; place-items: center;
        border-radius: 50%; border: 0; background: transparent;
        color: var(--chrome-ink); font-size: 18px; cursor: pointer;
        flex-shrink: 0; font-family: inherit;
    }

    .iconbtn:hover { background: rgba(40, 44, 63, .07); }
    .iconbtn:focus-visible { outline: 2px solid var(--brand); outline-offset: -2px; }
    .iconbtn.text { width: auto; padding: 0 10px; font-size: 13.5px; font-weight: 700; border-radius: 6px; color: var(--action); }
    .iconbtn svg { width: 20px; height: 20px; fill: currentColor; }

    .badged { position: relative; }

    .badged .dot {
        position: absolute; top: 3px; right: 2px;
        min-width: 16px; height: 16px; padding: 0 4px;
        border-radius: 9px; background: var(--brand);
        color: var(--on-brand); font-size: 9.5px; font-weight: 700;
        display: grid; place-items: center; line-height: 1;
        border: 1.5px solid var(--chrome);
    }

    /* ------------------------------------------------------------- screens */

    .stage { position: relative; flex: 1; overflow: hidden; }

    .screen {
        position: absolute; inset: 0;
        overflow-y: auto; overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        padding: 10px 10px 20px;
        display: none; flex-direction: column; gap: 9px;
    }

    /* The screen is a flex column, so its children would otherwise shrink to
       fit — rails and cards have to keep their own height. */
    .screen > * { flex-shrink: 0; }

    .screen.on { display: flex; animation: slide .22s cubic-bezier(.2, .7, .3, 1); }
    .screen.plain { background: var(--surface); padding: 16px 16px 20px; gap: 11px; }
    .screen.flush { padding: 0 0 20px; gap: 8px; }

    @keyframes slide { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .screen.on { animation: none; } }

    /* -------------------------------------------------------------- tabbar */

    .tabbar {
        display: flex; background: var(--surface);
        border-top: 1px solid var(--line);
        padding: 6px 2px 9px; flex-shrink: 0;
    }

    .tabbar button {
        flex: 1; border: 0; background: transparent; cursor: pointer;
        display: grid; gap: 3px; justify-items: center;
        font-size: 9.5px; color: var(--ink-3); font-family: inherit;
        padding: 2px 0; position: relative;
    }

    .tabbar button.on { color: var(--action); font-weight: 700; }
    .tabbar button:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; border-radius: 8px; }

    /* The active tab wears a pale pink pill behind its icon. */
    .tabbar svg {
        width: 21px; height: 21px; fill: currentColor;
        box-sizing: content-box; padding: 3px 14px;
        border-radius: 14px; transition: background .15s;
    }

    .tabbar button.on svg { background: var(--brand-soft); }
    .tabbar.hide { display: none; }

    .tabbar .tdot {
        position: absolute; top: -1px; left: 50%; margin-left: 5px;
        min-width: 15px; height: 15px; padding: 0 4px;
        border-radius: 9px; background: var(--brand); color: var(--on-brand);
        font-size: 9px; font-weight: 700; display: grid; place-items: center; line-height: 1;
    }

    /* ---------------------------------------------------------- components */

    .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px; padding: 12px;
    }

    .card.flat { padding: 0; overflow: hidden; }
    .card.tight { padding: 10px; }

    .sect {
        font-size: 13px; font-weight: 700; letter-spacing: -.01em;
        padding: 2px 4px; display: flex;
        justify-content: space-between; align-items: baseline;
    }

    .sect .more { color: var(--action); font-size: 11.5px; font-weight: 700; cursor: pointer; border: 0; background: 0; font-family: inherit; }
    .sect .cap { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 700; }

    .row {
        display: flex; align-items: center; gap: 11px;
        padding: 12px; border-bottom: 1px solid var(--line-soft);
        background: var(--surface); width: 100%;
        border-left: 0; border-right: 0; border-top: 0;
        text-align: left; font-family: inherit; color: inherit; cursor: pointer;
    }

    .row:last-child { border-bottom: 0; }
    .row:active { background: var(--surface-2); }
    .row:focus-visible { outline: 2px solid var(--action); outline-offset: -2px; }
    .row.static { cursor: default; }
    .row .grow { flex: 1; min-width: 0; }
    .row .t { font-size: 13.5px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
    .row .t span.txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .s { display: block; font-size: 11.5px; color: var(--ink-3); margin-top: 2px; line-height: 1.45; }
    .row .amt { font-size: 13.5px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .row .chev { color: var(--ink-3); font-size: 18px; }

    .thumb {
        width: 44px; height: 44px; border-radius: 9px;
        background: var(--surface-2); border: 1px solid var(--line);
        flex-shrink: 0; display: grid; place-items: center; font-size: 20px;
    }

    .thumb.lg { width: 68px; height: 78px; font-size: 30px; }
    .thumb.xs { width: 34px; height: 34px; font-size: 15px; border-radius: 5px; }

    .pill {
        display: inline-block; font-size: 9.5px; font-weight: 700;
        padding: 2px 7px; border-radius: 3px; white-space: nowrap;
    }

    .pill.ok { background: var(--ok-bg); color: var(--ok-ink); }
    .pill.warn { background: var(--warn-bg); color: var(--warn-ink); }
    .pill.crit { background: var(--crit-bg); color: var(--crit-ink); }
    .pill.info { background: var(--info-bg); color: var(--info-ink); }
    .pill.mute { background: var(--line-soft); color: var(--ink-2); }

    .btn {
        width: 100%; border: 0; border-radius: 6px;
        padding: 13px 14px; font-family: inherit;
        font-size: 14px; font-weight: 700; letter-spacing: .02em;
        background: var(--brand); color: var(--on-brand); cursor: pointer;
    }

    .btn:active { filter: brightness(.94); }
    .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .btn.buy { background: var(--brand); }
    .btn.cart { background: var(--surface); color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
    .btn.ghost { background: var(--surface); color: var(--action); border: 1px solid var(--line); }
    .btn.danger { background: var(--surface); color: var(--critical); border: 1px solid var(--line); }
    .btn.sm { padding: 9px 12px; font-size: 12.5px; width: auto; }
    .btn[disabled] { opacity: .5; cursor: not-allowed; }

    .btnrow { display: flex; gap: 9px; }
    .btnrow .btn { flex: 1; }

    .field { display: grid; gap: 5px; }
    .field .lbl { font-size: 11px; color: var(--ink-2); font-weight: 500; }

    .field input, .field select, .field textarea {
        width: 100%; padding: 11px 12px;
        border: 1px solid var(--line); border-radius: 8px;
        background: var(--surface); color: var(--ink);
        font-family: inherit; font-size: 14px;
    }

    .field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--action); outline-offset: -1px; border-color: var(--action); }
    .field textarea { min-height: 74px; resize: vertical; }
    .field .hint { font-size: 10.5px; color: var(--ink-3); }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .chiprow { display: flex; gap: 7px; overflow-x: auto; padding: 2px 4px 4px; scrollbar-width: none; }
    .chiprow::-webkit-scrollbar { display: none; }

    .chip {
        border: 1px solid var(--line); background: var(--surface);
        color: var(--ink-2); border-radius: 20px;
        padding: 6px 12px; font-size: 12px; font-weight: 500;
        font-family: inherit; white-space: nowrap; cursor: pointer;
    }

    .chip.on { background: var(--info-bg); border-color: var(--action); color: var(--action); font-weight: 700; }

    .spacer { flex: 1; min-height: 4px; }
    .note { font-size: 11.5px; color: var(--ink-3); line-height: 1.55; margin: 0; padding: 0 4px; }
    .divider { height: 1px; background: var(--line-soft); }

    .empty { display: grid; justify-items: center; gap: 8px; padding: 40px 20px; text-align: center; }
    .empty .big { font-size: 44px; }
    .empty .t { font-size: 15px; font-weight: 700; }
    .empty .s { font-size: 12.5px; color: var(--ink-3); line-height: 1.5; }

    .toast {
        position: absolute; left: 14px; right: 14px; bottom: 84px;
        background: var(--ink); color: var(--surface);
        padding: 12px 14px; border-radius: 6px;
        font-size: 13px; font-weight: 500;
        opacity: 0; transform: translateY(8px);
        transition: opacity .2s, transform .2s;
        pointer-events: none; z-index: 30; text-align: center;
    }

    .toast.on { opacity: 1; transform: none; }

    .deskhint {
        position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
        font-size: 11.5px; color: var(--ink-2); background: var(--surface);
        border: 1px solid var(--line); border-radius: 20px; padding: 6px 14px;
        white-space: nowrap;
    }
</style>

<style>
    /* ------------------------------------------------------ shopping bits */

    .rate {
        display: inline-flex; align-items: center; gap: 3px;
        background: var(--teal); color: #fff;
        font-size: 10.5px; font-weight: 700;
        padding: 1px 5px; border-radius: 3px;
    }

    .rate.low { background: var(--warn-bg); color: var(--warn-ink); }
    .ratecount { font-size: 10.5px; color: var(--ink-3); font-weight: 500; }

    .price { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .mrp { font-size: 11.5px; color: var(--ink-3); text-decoration: line-through; }
    .off { font-size: 11.5px; color: var(--sale); font-weight: 700; }
    .priceline { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }

    /* A category strip, the app's first row of navigation. */
    .circles { display: flex; gap: 4px; overflow-x: auto; padding: 4px 2px; scrollbar-width: none; }
    .circles::-webkit-scrollbar { display: none; }

    .circles button {
        border: 0; background: transparent; cursor: pointer; font-family: inherit;
        display: grid; justify-items: center; gap: 5px;
        width: 68px; flex-shrink: 0; padding: 4px 0;
    }

    .circles .ic {
        width: 54px; height: 54px; border-radius: 16px;
        background: var(--surface); border: 1px solid var(--line);
        display: grid; place-items: center; font-size: 24px;
    }

    .circles button.on .ic { border-color: var(--brand); }
    .circles button.on .nm { color: var(--action); font-weight: 700; }

    .circles .nm { font-size: 10.5px; color: var(--ink-2); font-weight: 500; line-height: 1.25; text-align: center; }

    /* Banner rail — one card per marketplace campaign. */
    .rail { display: flex; gap: 9px; overflow-x: auto; padding: 2px 4px 6px; scroll-snap-type: x mandatory; scrollbar-width: none; }
    .rail::-webkit-scrollbar { display: none; }
    .rail > * { scroll-snap-align: start; flex-shrink: 0; }

    .banner {
        width: 300px; height: 132px; border-radius: 12px;
        padding: 16px; color: #fff; cursor: pointer;
        border: 0; font-family: inherit; text-align: left;
        display: grid; align-content: center; gap: 4px;
    }

    .banner .k { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; opacity: .85; }
    .banner .h { font-size: 21px; font-weight: 900; letter-spacing: -.02em; line-height: 1.1; }
    .banner .d { font-size: 12px; opacity: .9; }

    .pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .pcard {
        background: var(--surface); border: 1px solid var(--line);
        border-radius: 12px; padding: 10px; cursor: pointer;
        font-family: inherit; color: inherit; text-align: left;
        display: grid; gap: 5px; align-content: start; position: relative;
    }

    .pcard:active { background: var(--surface-2); }
    .pcard:focus-visible { outline: 2px solid var(--action); outline-offset: 1px; }

    .pcard .shot {
        height: 116px; border-radius: 9px; background: var(--surface-2);
        display: grid; place-items: center; font-size: 46px;
    }

    .pcard.mini { width: 132px; flex-shrink: 0; }
    .pcard.mini .shot { height: 96px; font-size: 38px; }
    .pcard .nm { font-size: 12.5px; font-weight: 500; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .pcard .br { font-size: 10.5px; color: var(--ink-3); font-weight: 500; }

    .heart {
        position: absolute; top: 6px; right: 6px;
        width: 28px; height: 28px; border-radius: 50%;
        border: 1px solid var(--line); background: var(--surface);
        display: grid; place-items: center; cursor: pointer;
        font-size: 13px; color: var(--ink-3); padding: 0;
    }

    .heart.on { color: var(--brand); border-color: var(--brand); }

    .assured { font-size: 9.5px; font-weight: 700; color: var(--action); letter-spacing: .02em; }

    /* -------------------------------------------------------- product page */

    .gallery {
        background: var(--surface); border-radius: 12px;
        border: 1px solid var(--line); padding: 8px;
        display: grid; gap: 8px;
    }

    .shotbig { height: 250px; display: grid; place-items: center; font-size: 108px; background: var(--surface-2); border-radius: 9px; }
    .shots { display: flex; gap: 7px; justify-content: center; }

    .shots button {
        width: 44px; height: 44px; border-radius: 5px;
        border: 1px solid var(--line); background: var(--surface-2);
        font-size: 20px; cursor: pointer; display: grid; place-items: center;
    }

    .shots button.on { border-color: var(--action); border-width: 2px; }

    .swatches { display: flex; gap: 7px; flex-wrap: wrap; }

    .swatch {
        min-width: 42px; padding: 8px 11px;
        border: 1px solid var(--line); border-radius: 4px;
        background: var(--surface); color: var(--ink);
        font-family: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer;
    }

    .swatch.on { border-color: var(--action); border-width: 2px; color: var(--action); font-weight: 700; }
    .swatch.out { opacity: .45; text-decoration: line-through; cursor: not-allowed; }

    .specs { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .specs td { padding: 8px 0; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
    .specs td:first-child { color: var(--ink-3); width: 40%; }
    .specs tr:last-child td { border-bottom: 0; }

    .bars { display: grid; gap: 5px; }
    .bar { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--ink-3); }
    .bar .track { flex: 1; height: 5px; border-radius: 3px; background: var(--line-soft); overflow: hidden; }
    .bar .fill { height: 100%; background: var(--deal); }
    .bar .n { width: 34px; text-align: right; font-variant-numeric: tabular-nums; }

    .review { display: grid; gap: 6px; padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
    .review:last-child { border-bottom: 0; }
    .review .head { display: flex; align-items: center; gap: 7px; }
    .review .body { font-size: 12.5px; line-height: 1.55; color: var(--ink-2); }
    .review .who { font-size: 11px; color: var(--ink-3); }

    .stars { display: flex; gap: 3px; }
    .stars button { border: 0; background: 0; font-size: 27px; cursor: pointer; padding: 0; color: var(--line); line-height: 1; }
    .stars button.on { color: var(--gold); }

    /* A bar pinned over the scroller, not inside it — the two buy actions
       stay reachable however far down the page the shopper is. */
    .buybar {
        position: absolute; left: 0; right: 0; bottom: 0;
        display: flex; background: var(--surface);
        border-top: 1px solid var(--line); z-index: 12;
    }

    .buybar button {
        flex: 1; border: 0; padding: 15px 8px;
        font-family: inherit; font-size: 13.5px; font-weight: 700;
        color: var(--on-brand); cursor: pointer; letter-spacing: .02em;
    }

    /* Two weights, not two hues: the secondary action is the same pink,
       hollowed out. */
    .buybar .add { background: var(--surface); color: var(--brand); }
    .buybar .now { background: var(--brand); }
    .haspad { padding-bottom: 66px !important; }

    /* --------------------------------------------------------------- cart */

    .line { display: flex; gap: 11px; padding: 12px; border-bottom: 1px solid var(--line-soft); }
    .line:last-child { border-bottom: 0; }
    .line .grow { flex: 1; min-width: 0; }
    .line .nm { display: block; font-size: 13px; font-weight: 500; line-height: 1.35; }
    .line .meta { display: block; font-size: 11px; color: var(--ink-3); margin-top: 3px; }

    .qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
    .qty button { width: 30px; height: 28px; border: 0; background: var(--surface); color: var(--ink); font-size: 16px; cursor: pointer; font-family: inherit; }
    .qty button:disabled { color: var(--ink-3); cursor: not-allowed; }

    .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); transition: transform .16s; }
    .switch.on { background: var(--deal); }

                ${checkout.payment === 'cod' ? `
                <div class="card"><p class="note" style="padding:0">Keep ${money(cartTotal())} ready. The courier accepts UPI at the door too.

                <div class="sect">Delivering to</div>
                <div class="card">
                    <div style="font-size:13px;font-weight:700">${esc(customer.first_name)} ${esc(customer.last_name)} · ${esc(addresses.find(a => a.id === checkout.address_id).label)}</div>

                </div>

        success: () => {
            const o = lastOrder;
            return {
                bar: { title: 'Order placed' }, chrome: 'none', plain: true,

                : ['cancelled', 'refunded'].includes(o.status));

            return {
                bar: { title: 'My orders', sub: `${orders.length} order${orders.length === 1 ? '' : 's'}` },

                html: `
                <div class="chiprow">
                    ${filters.map(([k, label]) => `<button class="chip ${ordersFilter === k ? 'on' : ''}" data-act="ordersFilter:${k}">${label}</button>`).join('')}
                </div>
                ${requests.length ? `<div class="sect">Cancellations & returns</div>
                <div class="card flat">
                    ${requests.map(r => `<button class="row" data-go="request:${r.number}">

                        <span class="grow"><span class="t"><span class="txt">${esc(r.number)}</span>${reqPill(r)}</span>

                                  : esc(o.eta || 'Being packed')}</span></span>
                        <span class="chev">›</span></button>`).join('')}
                    <div style="display:flex;gap:10px;padding:10px 12px;border-top:1px solid var(--line-soft)">
                        ${o.status === 'shipped' ? `<button class="btn ghost sm" data-go="track:${o.number}">Track</button>` : ''}
                        ${['pending', 'processing', 'on_hold'].includes(o.status) ? `<button class="btn ghost sm" data-act="startCancel:${o.number}">Cancel</button>` : ''}
                        ${o.status === 'completed' ? `<button class="btn ghost sm" data-act="startReturn:${o.number}">Return</button>
                            <button class="btn ghost sm" data-act="startRate:${o.items[0].product_id}">Rate</button>` : ''}
                        <button class="btn ghost sm" data-act="reorder:${o.number}">Buy again</button>
                    </div>
                </div>`).join('')
                : `<div class="empty"><span class="big">📦</span><span class="t">Nothing here</span>
                    <span class="s">No orders in this filter yet.</span></div>`}`
            };
        },

        order: num => {
            const o = order(num);

            const canCancel = ['pending', 'processing', 'on_hold'].includes(o.status);
            const delivered = o.status === 'completed';

            return {
                bar: { title: `Order ${o.number}`, sub: esc(o.placed_at) }, chrome: 'back',
                html: `
                <div class="card">
                    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
                        ${statusPill(o)}
                        <span style="font-size:12.5px;color:var(--ink-2)">${esc(o.eta || (delivered ? 'Delivered ' + o.delivered_at : o.status === 'cancelled' ? 'Cancelled ' + (o.cancelled_at || '') : ''))}</span>
                    </div>
                    <div class="track">
                        ${[['Order placed', o.placed_at],
                           [o.payment_method === 'Cash on delivery' ? 'Pay on delivery' : 'Payment confirmed', o.paid_at || 'Due at the door'],
                           ['Shipped', o.shipped_at],
                           ['Delivered', o.delivered_at]].map(([t, when], i, arr) => {
                            const done = !!when && !(t === 'Delivered' && !o.delivered_at);
                            const isNow = done && !arr.slice(i + 1).some(([, w]) => !!w);
                            return `<div class="tnode ${done ? 'done' : ''} ${isNow ? 'now' : ''}">
                                <span class="mark"><span class="bead"></span><span class="stem"></span></span>
                                <span class="txt"><span class="t">${t}</span><span class="s">${when ? esc(when) : 'Pending'}</span></span>
                            </div>`;
                        }).join('')}
                    </div>
                    ${o.status === 'shipped' ? `<div style="height:11px"></div>
                        <button class="btn ghost sm" style="width:100%" data-go="track:${o.number}">Track with ${esc(partner(o.carrier).name)}</button>` : ''}
                </div>

                ${groupByVendor(o.items).map(g => `
                <div class="card flat">
                    <div class="sellerhead">🏬 ${esc(vendor(g.vendor_id).name)}</div>
                    ${g.lines.map(i => `<div class="line">
                        <span class="thumb lg">${i.emoji}</span>
                        <span class="grow">
                            <span class="nm">${esc(i.name)}</span>
                            <span class="meta">Qty ${i.quantity}${Object.keys(i.options).length ? ' · ' + Object.entries(i.options).map(([k, v]) => esc(k) + ': ' + esc(v)).join(' · ') : ''}</span>
                            <div class="priceline" style="margin-top:5px"><span class="price">${money(i.total)}</span></div>
                            <div class="lineacts">
                                <button class="linkbtn" data-go="product:${i.product_id}">Buy again</button>
                                ${canCancel ? `<button class="linkbtn crit" data-act="startCancel:${o.number}">Cancel</button>` : ''}
                                ${delivered ? `<button class="linkbtn" data-act="startReturn:${o.number}">Return</button>
                                    <button class="linkbtn" data-act="startRate:${i.product_id}">Rate</button>` : ''}
                            </div>
                        </span>
                    </div>`).join('')}
                </div>`).join('')}

                <div class="sect">Delivery address</div>
                <div class="card">
                    <div style="font-size:13px;font-weight:700">${esc(customer.first_name)} ${esc(customer.last_name)} · ${esc(a.label)}</div>
                    <div style="font-size:12.5px;color:var(--ink-2);line-height:1.5;margin-top:5px">${addrLines(a).map(esc).join('<br>')}</div>
                    <div style="font-size:12px;color:var(--ink-3);margin-top:5px">${esc(a.phone)}</div>
                </div>

                <div class="sect">Payment</div>
                <div class="card"><div class="totals">
                    <div class="r"><span>Items</span><span>${money(o.subtotal)}</span></div>
                    ${o.discount_total ? `<div class="r cut"><span>Discount${o.coupon_code ? ' (' + esc(o.coupon_code) + ')' : ''}</span><span>−${money(o.discount_total)}</span></div>` : ''}
                    <div class="r ${o.shipping_total === 0 ? 'free' : ''}"><span>Delivery</span><span>${o.shipping_total === 0 ? 'FREE' : money(o.shipping_total)}</span></div>
                    <div class="r"><span>GST</span><span>${money(o.tax_total)}</span></div>
                    <div class="r grand"><span>${o.payment_status === 'paid' ? 'Paid' : 'Payable'}</span><span>${money(o.grand_total)}</span></div>
                    <div class="r"><span style="color:var(--ink-3);font-size:11.5px">${esc(o.payment_method)}${o.transaction_id ? ' · ' + esc(o.transaction_id) : ''}</span><span></span></div>

                <div class="card flat">
                    <button class="row" data-act="invoice:${o.number}">

                    <button class="row" data-go="help">
                        <span class="thumb">💬</span>
                        <span class="grow"><span class="t"><span class="txt">Need help with this order</span></span>
                            <span class="s">Chat, or call the seller</span></span><span class="chev">›</span></button>
                </div>`
            };
        },

        track: num => {
            const o = order(num);
            const dp = partner(o.carrier) || deliveryPartners[0];
            const nodes = [
                { t: 'Picked up from the seller', s: `${vendor(o.items[0].vendor_id).name}, ${vendor(o.items[0].vendor_id).city}`, when: o.shipped_at, done: true },
                { t: 'In transit', s: 'Left the Chennai sorting hub', when: '30 Aug, 4:15 am', done: true },
                { t: 'Out for delivery', s: 'Assigned to a rider near you', when: 'Expected 1 Sep, morning', done: false },
                { t: 'Delivered', s: 'Signature or OTP at the door', when: o.delivered_at || 'Expected 1 Sep', done: !!o.delivered_at }
            ];
            return {
                bar: { title: 'Track order', sub: `${o.number} · ${dp.name}` }, chrome: 'back',
                html: `
                <div class="card" style="display:grid;gap:6px">
                    <div style="font-size:15px;font-weight:700">${esc(o.eta || 'Delivered ' + o.delivered_at)}</div>

                    </div>
                </div>
                <div class="card"><div class="track">
                    ${nodes.map((n, i) => `<div class="tnode ${n.done ? 'done' : ''} ${n.done && !nodes[i + 1]?.done ? 'now' : ''}">
                        <span class="mark"><span class="bead"></span><span class="stem"></span></span>
                        <span class="txt"><span class="t">${esc(n.t)}</span><span class="s">${esc(n.s)}<br>${esc(n.when)}</span></span>
                    </div>`).join('')}
                </div></div>
                <div class="card flat">
                    ${o.items.map(i => `<div class="row static">
                        <span class="thumb">${i.emoji}</span>
                        <span class="grow"><span class="t"><span class="txt">${esc(i.name)}</span></span>
                            <span class="s">Qty ${i.quantity} · ${esc(vendor(i.vendor_id).name)}</span></span></div>`).join('')}
                </div>
                <div class="card flat">
                    <button class="row" data-act="copyTracking:${esc(o.tracking_number)}">
                        <span class="thumb">🔗</span>
                        <span class="grow"><span class="t"><span class="txt">Copy tracking number</span></span>
                            <span class="s">${esc(dp.tracking_url)}</span></span><span class="chev">›</span></button>
                    <button class="row" data-act="callPartner:${esc(dp.support_phone)}">

                        <span class="grow"><span class="t"><span class="txt">Call ${esc(dp.name)}</span></span>

                        <span class="grow"><span class="t">${esc(i.name)}</span>
                            <span class="s">Qty ${i.quantity} · ${money(i.total)} · ${esc(vendor(i.vendor_id).name)}</span></span>
                    </button>`).join('')}
                </div>
                <div class="sect">Why?</div>
                <div class="card flat">
                    ${cancelReasons.map(([k, label]) => `<button class="opt" style="padding:11px 12px" data-act="cancelReason:${k}">
                        <span class="mark ${cancelDraft.reason === k ? 'on' : ''}"></span>
                        <span class="grow"><span class="t">${esc(label)}</span></span>
                    </button>`).join('')}
                </div>
                <div class="card">
                    <label class="field"><span class="lbl">Anything the seller should know? (optional)</span>

                </div>
                <div class="card" style="background:var(--info-bg);border-color:transparent">
                    <div style="font-size:12.5px;font-weight:700;color:var(--info-ink)">Refund of ${money(cancelDraft.amount)}</div>
                    <p class="note" style="padding:6px 0 0;color:var(--info-ink)">
                        ${o.payment_status === 'paid'
                            ? 'Goes back to your ' + esc(o.payment_method) + ' within 5–7 working days once the seller accepts.'
                            : 'Nothing was charged — there is nothing to refund.'}</p>
                </div>
                <p class="note">The seller has 24 hours to accept. Items already handed to the courier
                    have to be returned instead.</p>
                <div class="spacer"></div>`
            };
        },

        returnForm: () => {
            const o = order(returnDraft.order);
            return {
                bar: { title: 'Return items', sub: o.number }, chrome: 'back',
                bottom: `<button class="now" style="background:var(--brand)" data-act="submitReturn">REQUEST RETURN</button>`,
                html: `
                <div class="sect">What are you sending back?</div>
                <div class="card flat">
                    ${o.items.map((i, idx) => `<button class="opt" style="padding:12px" data-act="returnItem:${idx}">
                        <span class="mark sq ${returnDraft.items.includes(idx) ? 'on' : ''}"></span>
                        <span class="grow"><span class="t">${esc(i.name)}</span>
                            <span class="s">Qty ${i.quantity} · ${money(i.total)} · returns close ${esc(product(i.product_id).returnDays)} days after delivery</span></span>
                    </button>`).join('')}
                </div>
                <div class="sect">What went wrong?</div>
                <div class="card flat">
                    ${refundReasons.map(([k, label]) => `<button class="opt" style="padding:11px 12px" data-act="returnReason:${k}">
                        <span class="mark ${returnDraft.reason === k ? 'on' : ''}"></span>
                        <span class="grow"><span class="t">${esc(label)}</span></span>
                    </button>`).join('')}
                </div>
                <div class="card">
                    <label class="field"><span class="lbl">Tell the seller what happened</span>
                        <textarea placeholder="The pallu had a tear near the border." data-bind="note">${esc(returnDraft.note)}</textarea></label>
                    <div style="height:10px"></div>
                    <button class="btn ghost sm" style="width:100%" data-act="addPhoto">📷 Add a photo (${returnDraft.photos})</button>
                </div>
                <div class="sect">Where should the money go?</div>
                <div class="card flat">
                    ${[['original', 'Back to my ' + o.payment_method, 'Usually 5–7 working days'],
                       ['store_credit', 'CFO Shop credit', 'Instant, spend it on any seller'],
                       ['upi', 'UPI', 'priya@okhdfcbank']].map(([k, t, s]) =>
                        `<button class="opt" style="padding:11px 12px" data-act="returnMethod:${k}">
                            <span class="mark ${returnDraft.method === k ? 'on' : ''}"></span>
                            <span class="grow"><span class="t">${esc(t)}</span><span class="s">${esc(s)}</span></span>
                        </button>`).join('')}
                </div>
                <p class="note">A courier picks the item up from your delivery address, free.
                    Keep the packaging and the tags on.</p>
                <div class="spacer"></div>`
            };
        },

        request: num => {
            const r = requests.find(x => x.number === num);
            const label = (r.kind === 'refund' ? refundReasons : cancelReasons).find(([k]) => k === r.reason)?.[1] || r.reason;
            const steps = r.kind === 'refund'
                ? [['Return requested', r.raised, true], ['Seller approved', r.updated, r.status === 'approved'],
                   ['Item picked up', 'Scheduled 22 Aug', r.status === 'approved'], ['Refund issued', r.eta, false]]
                : [['Cancellation requested', r.raised, true], ['Seller approved', r.updated, r.status === 'approved'],
                   ['Refund issued', r.eta, r.status === 'approved']];
            return {
                bar: { title: r.number, sub: r.kind === 'refund' ? 'Return & refund' : 'Cancellation' }, chrome: 'back',
                html: `
                <div class="card" style="display:grid;gap:8px">
                    <div style="display:flex;gap:8px;align-items:center">${reqPill(r)}
                        <span style="font-size:12.5px;color:var(--ink-2)">Raised ${esc(r.raised)} on order ${esc(r.order)}</span></div>
                    <div style="font-size:14px;font-weight:700">${money(r.amount)} to ${esc(r.method).toLowerCase()}</div>
                    <div style="font-size:12.5px;color:var(--ink-3)">${esc(r.eta)}</div>
                </div>

    /* --------------------------------------------------------- rendering */

    function render() {
        const key = stack[stack.length - 1];
        const cut = key.indexOf(':');
        const name = cut === -1 ? key : key.slice(0, cut);
        const arg = cut === -1 ? undefined : key.slice(cut + 1);
        const s = screens[name](arg);
        const c = s.chrome;
        const icons = s.icons || {};

        $('barTitle').textContent = s.bar.title || '';
        const sub = $('barSub');
        sub.textContent = s.bar.sub || '';
        sub.hidden = !s.bar.sub;
        $('barTitles').hidden = !!s.bar.search;
        $('searchBtn').hidden = !s.bar.search;

        $('backBtn').hidden = !(c === 'back' || c === 'back-save');
        $('saveBtn').hidden = c !== 'back-save';
        $('wishBtn').hidden = !icons.wish;
        $('bellBtn').hidden = !icons.bell;
        $('cartBtn').hidden = !icons.cart;
        $('wishDot').textContent = wishlist.length;
        $('wishDot').hidden = wishlist.length === 0;
        $('bellDot').textContent = unread();
        $('bellDot').hidden = unread() === 0;
        $('cartDot2').textContent = cartCount();
        $('cartDot2').hidden = cartCount() === 0;
        $('cartDot').textContent = cartCount();
        $('cartDot').hidden = cartCount() === 0;

        tabbar.classList.toggle('hide', c !== 'main');
        tabbar.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.tab === s.tab));

        stage.innerHTML =
            `<div class="screen on ${s.plain ? 'plain' : ''} ${s.flush ? 'flush' : ''} ${s.bottom ? 'haspad' : ''}">${s.html}</div>`
            + (s.bottom ? `<div class="buybar">${s.bottom}</div>` : '')
            + sheetHtml();

        // Typing in the search box re-renders the suggestions under the caret,
        // so put the caret back where it was.
        if (name === 'search') {
            const box = document.getElementById('q');
            if (box && document.activeElement !== box) {
                box.focus();
                box.setSelectionRange(box.value.length, box.value.length);
            }
        }
    }

    /** The product page is entered fresh, with the seller's first in-stock
        value pre-selected for every option — the way a shopper expects. */
    function go(key) {
        // A category tap is a listing with one filter pre-set, not its own screen.
        if (key.startsWith('category:')) {
            plp = { ...plp, category_id: +key.slice(9) };
            query = '';
            key = 'results';
        }

        if (key.startsWith('product:')) {
            const p = product(key.split(':')[1]);
            pdp = { image: 0, opts: {} };
            p.options.forEach(o => {
                const first = o.values.find(v => v.stock > 0);
                if (first) pdp.opts[o.name] = first.v;
            });
            recent = [p.id, ...recent.filter(id => id !== p.id)].slice(0, 6);
        }
        stack.push(key);
        render();
    }

    function back() { if (stack.length > 1) { stack.pop(); sheet = null; render(); } }
    function root(key) { stack = [key]; sheet = null; render(); }

    /* ----------------------------------------------------------- actions */

    const blankAddr = () => ({
        id: null, label: 'Home', first_name: customer.first_name, last_name: customer.last_name,
        phone: customer.phone, address_line1: '', address_line2: '', city: '', state: 'Tamil Nadu',
        postcode: '', country: 'IN', is_default_shipping: false, is_default_billing: false
    });

    const actions = {

        /* ------------------------------------------------------ getting in */

        signin() { signedIn = true; root('home'); toast('Signed in as ' + customer.first_name); },
        resend() { toast('New code sent to 98765 43210'); },
        sentReset() { back(); toast('Reset link sent to ' + customer.email); },
        signout() { signedIn = false; cart = []; root('login'); },
        signoutAll() { signedIn = false; root('login'); toast('Signed out everywhere'); },
        revoke() { toast('Chrome on Windows signed out'); },
        changedPw() { back(); toast('Password changed. Other devices were signed out.'); },

        /* ----------------------------------------------------- getting around */

        goHome() { root('home'); },
        goOrders() { root('orders'); },
        seeDeals() { query = ''; plp = { ...plp, category_id: null, minOff: 30 }; go('results'); },
        seeAll() { query = ''; plp = { ...plp, category_id: null, minOff: null }; go('results'); },
        runSearch() { back(); go('results'); },
        'recall': t => { query = decodeURIComponent(t); render(); },

        /* --------------------------------------------------- listing & filters */

        'sheet': which => { sheet = which; render(); },
        closeSheet() { sheet = null; render(); },
        'sort': k => { plp.sort = k; sheet = null; render(); },
        'fPrice': v => { plp.maxPrice = plp.maxPrice === +v ? null : +v; render(); },
        'fRating': v => { plp.minRating = plp.minRating === +v ? null : +v; render(); },
        'fOff': v => { plp.minOff = plp.minOff === +v ? null : +v; render(); },
        'fVendor': v => { plp.vendor_id = plp.vendor_id === +v ? null : +v; render(); },
        fAssured() { plp.assured = !plp.assured; render(); },
        fCod() { plp.cod = !plp.cod; render(); },
        clearFilters() {
            plp = { ...plp, maxPrice: null, minRating: null, minOff: null, vendor_id: null, assured: false, cod: false };
            render();
        },

        /* -------------------------------------------------------- product page */

        'shot': i => { pdp.image = +i; render(); },
        'pick': rest => {
            const [name, ...val] = rest.split(':');
            pdp.opts[name] = val.join(':');
            render();
        },
        'wish': id => {
            id = +id;
            wishlist = wished(id) ? wishlist.filter(x => x !== id) : [id, ...wishlist];
            toast(wished(id) ? 'Saved to your wishlist' : 'Removed from your wishlist');
            render();
        },
        pincode() { toast('Delivering to 600090 — pincode picker is not in this prototype'); },
        'notifyMe': id => toast('We\'ll text you when ' + product(id).name.split(' ').slice(0, 3).join(' ') + ' is back'),

        'addCart': id => {
            const p = product(id);
            const missing = p.options.find(o => !pdp.opts[o.name]);
            if (missing) return toast('Pick a ' + missing.name.toLowerCase() + ' first');
            addToCart(p.id, { ...pdp.opts }, 1);
            render();
            toast('Added to cart');
        },

        'buyNow': id => {
            actions.addCart(id);
            const p = product(id);
            if (p.options.every(o => pdp.opts[o.name])) root('cart');
        },

        /* --------------------------------------------------------------- cart */

        'qty': arg => {
            const [key, delta] = [arg.slice(0, arg.lastIndexOf(':')), +arg.slice(arg.lastIndexOf(':') + 1)];
            const line = cart.find(l => cartKeyOf(l) === key);
            line.qty = Math.max(1, Math.min(10, line.qty + delta));
            render();
        },
        'removeLine': key => { cart = cart.filter(l => cartKeyOf(l) !== key); render(); toast('Removed from cart'); },
        'saveLater': key => {
            const line = cart.find(l => cartKeyOf(l) === key);
            if (!wished(line.pid)) wishlist = [line.pid, ...wishlist];
            cart = cart.filter(l => cartKeyOf(l) !== key);
            render();
            toast('Moved to your wishlist');
        },
        'apply': code => {
            checkout.coupon = coupons.find(c => c.code === code);
            back();
            toast(code + ' applied — you save ' + money(couponCut()));
        },
        unapply() { checkout.coupon = null; render(); toast('Coupon removed'); },
        applyTyped() {
            const typed = ($('couponIn')?.value || '').trim().toUpperCase();
            const found = coupons.find(c => c.code === typed);
            if (!found) return toast('That code isn\'t valid on this order');
            if (cartSubtotal() < found.min) return toast('Add ' + money(found.min - cartSubtotal()) + ' more to use ' + typed);
            actions.apply(found.code);
        },

        /* ----------------------------------------------------------- checkout */

        startCheckout() { go('checkAddress'); },
        'pickAddr': id => { checkout.address_id = +id; render(); },
        'pickShip': code => { checkout.shipping = code; render(); },
        'pickPay': code => { checkout.payment = code; render(); },
        newAddr() { addrDraft = blankAddr(); go('addrForm'); },
        'editAddr': id => { addrDraft = { ...addresses.find(a => a.id === +id) }; go('addrForm'); },
        'addrLabel': l => { addrDraft.label = l; render(); },
        addrDefault() { addrDraft.is_default_shipping = !addrDraft.is_default_shipping; render(); },

        saveAddr() {
            if (!addrDraft.address_line1 || !addrDraft.city || !addrDraft.postcode)
                return toast('Add the street, city and pincode');

            if (addrDraft.is_default_shipping) addresses.forEach(a => a.is_default_shipping = false);

            if (addrDraft.id) {
                addresses = addresses.map(a => a.id === addrDraft.id ? { ...addrDraft } : a);
            } else {
                addrDraft.id = Math.max(0, ...addresses.map(a => a.id)) + 1;
                addresses.push({ ...addrDraft });
                checkout.address_id = addrDraft.id;
            }
            back();
            toast('Address saved');
        },

        'makeDefault': id => {
            addresses.forEach(a => a.is_default_shipping = a.id === +id);
            checkout.address_id = +id;
            render();
            toast('Default address updated');
        },

        'delAddr': id => {
            if (addresses.length === 1) return toast('Keep at least one address');
            addresses = addresses.filter(a => a.id !== +id);
            if (checkout.address_id === +id) checkout.address_id = addresses[0].id;
            render();
            toast('Address deleted');
        },

        /*
        | POST /orders. The basket goes over as it stands — lines keep their own
        | vendor, so an order across two sellers stays one order with two
        | shipments, which is what the seller app and the payouts expect.
        */
        placeOrder() {
            const pay = paymentMethods.find(m => m.code === checkout.payment);
            const next = '#' + (Math.max(...orders.map(o => +o.number.slice(1))) + 1);

            const o = {
                number: next,
                status: 'processing',
                payment_status: pay.code === 'cod' ? 'pending' : 'paid',
                fulfillment_status: 'unfulfilled',
                payment_method: pay.name,
                transaction_id: pay.code === 'cod' ? null : pay.code.toUpperCase() + '-' + Math.floor(Math.random() * 900000 + 100000),
                carrier: null, tracking_number: null,
                placed_at: '31 Aug, 9:41 am',
                paid_at: pay.code === 'cod' ? null : '31 Aug, 9:41 am',
                shipped_at: null, delivered_at: null,
                eta: shippingOptions.find(s => s.code === checkout.shipping).detail.replace('Arrives', 'Arriving'),
                address_id: checkout.address_id,
                shipping_method: shippingOptions.find(s => s.code === checkout.shipping).name,
                items: cart.map(l => {
                    const p = product(l.pid);
                    return { product_id: p.id, name: p.name, vendor_id: p.vendor_id, emoji: p.images[0],
                             options: { ...l.opts }, unit_price: p.price, quantity: l.qty,
                             total: p.price * l.qty, fulfillment_status: 'unfulfilled' };
                }),
                subtotal: cartSubtotal(), discount_total: couponCut(),
                shipping_total: shipCost(), tax_total: cartTax(), grand_total: cartTotal(),
                coupon_code: checkout.coupon?.code || null
            };

            orders = [o, ...orders];
            lastOrder = o;
            customer.orders_count += 1;
            customer.total_spent += o.grand_total;
            notifications = [{ t: 'Order ' + o.number + ' placed', b: money(o.grand_total) + ' · ' + o.payment_method, w: 'just now', read: false, go: 'order:' + o.number }, ...notifications];
            cart = [];
            checkout.coupon = null;
            root('success');
        },

        trackNew() { root('orders'); go('order:' + lastOrder.number); },

        /* ------------------------------------------------------------- orders */

        'ordersFilter': k => { ordersFilter = k; render(); },
        'invoice': num => toast('Invoice for ' + num + ' emailed to ' + customer.email),
        'copyTracking': n => toast(n + ' copied'),
        'callPartner': phone => toast('Calling ' + phone + '…'),

        'reorder': num => {
            order(num).items.forEach(i => addToCart(i.product_id, { ...i.options }, i.quantity));
            root('cart');
            toast('Added ' + order(num).items.length + ' item(s) back to your cart');
        },

        /* ---------------------------------------------- cancellations & returns */

        'startCancel': num => {
            const o = order(num);
            cancelDraft = { order: num, items: o.items.map((_, i) => i), reason: null, note: '', amount: o.grand_total };
            go('cancelForm');
        },
        'cancelItem': idx => {
            idx = +idx;
            const o = order(cancelDraft.order);
            cancelDraft.items = cancelDraft.items.includes(idx)
                ? cancelDraft.items.filter(x => x !== idx) : [...cancelDraft.items, idx];
            cancelDraft.amount = cancelDraft.items.reduce((s, i) => s + o.items[i].total, 0);
            render();
        },
        'cancelReason': k => { cancelDraft.reason = k; render(); },

        submitCancel() {
            if (!cancelDraft.items.length) return toast('Pick at least one item');
            if (!cancelDraft.reason) return toast('Tell the seller why');

            const o = order(cancelDraft.order);
            const whole = cancelDraft.items.length === o.items.length;
            const num = 'CAN-' + String(nextCancellation++).padStart(5, '0');

            requests = [{
                number: num, kind: 'cancellation', order: o.number, status: 'pending',
                reason: cancelDraft.reason, note: cancelDraft.note,
                items: cancelDraft.items.map(i => o.items[i].name),
                amount: cancelDraft.amount, method: 'Original payment method',
                raised: '31 Aug', updated: '31 Aug',
                eta: o.payment_status === 'paid' ? 'Refund starts once the seller accepts' : 'Nothing was charged'
            }, ...requests];

            if (whole) { o.status = 'cancelled'; o.cancelled_at = '31 Aug, 9:44 am'; }

            root('orders');
            go('request:' + num);
            toast('Cancellation requested');
        },

        'startReturn': num => {
            const o = order(num);
            returnDraft = { order: num, items: [0], reason: null, note: '', method: 'original', photos: 0 };
            go('returnForm');
        },
        'returnItem': idx => {
            idx = +idx;
            returnDraft.items = returnDraft.items.includes(idx)
                ? returnDraft.items.filter(x => x !== idx) : [...returnDraft.items, idx];
            render();
        },
        'returnReason': k => { returnDraft.reason = k; render(); },
        'returnMethod': k => { returnDraft.method = k; render(); },
        addPhoto() {
            const d = returnDraft && stack[stack.length - 1] === 'returnForm' ? returnDraft : ratingDraft;
            if (d.photos >= 5) return toast('Five photos is the limit');
            d.photos += 1;
            render();
        },

        submitReturn() {
            if (!returnDraft.items.length) return toast('Pick at least one item');
            if (!returnDraft.reason) return toast('Tell the seller what went wrong');

            const o = order(returnDraft.order);
            const num = 'REF-' + String(nextRefund++).padStart(5, '0');
            const amount = returnDraft.items.reduce((s, i) => s + o.items[i].total, 0);
            const method = { original: 'Original payment method', store_credit: 'Store credit', upi: 'UPI' }[returnDraft.method];

            requests = [{
                number: num, kind: 'refund', order: o.number, status: 'pending',
                reason: returnDraft.reason, note: returnDraft.note,
                items: returnDraft.items.map(i => o.items[i].name),
                amount, method, raised: '31 Aug', updated: '31 Aug',
                eta: 'Pickup is booked once the seller accepts'
            }, ...requests];

            root('orders');
            go('request:' + num);
            toast('Return requested');
        },

        'withdraw': num => {
            requests = requests.filter(r => r.number !== num);
            root('orders');
            toast(num + ' withdrawn');
        },

        /* ------------------------------------------------------------ reviews */

        'startRate': id => { ratingDraft = { pid: +id, stars: 0, title: '', body: '', photos: 0 }; go('rate:' + id); },
        'setStars': n => { ratingDraft.stars = +n; render(); },
        submitRating() {
            if (!ratingDraft.stars) return toast('Tap a star first');
            back();
            toast('Thanks — your review is live');
        },

        /* ------------------------------------------------------ notifications */

        'openNotif': i => {
            const n = notifications[+i];
            n.read = true;
            if (n.go) go(n.go); else render();
        },
        readAll() { notifications.forEach(n => n.read = true); render(); },
        togglePush() { pushOn = !pushOn; render(); toast(pushOn ? 'Push notifications on' : 'Push notifications off'); },
        toggleDeals() { dealAlerts = !dealAlerts; render(); },
        toggleOrderAlerts() { orderAlerts = !orderAlerts; render(); },
        toggleMarketing() { customer.accepts_marketing = !customer.accepts_marketing; render(); },

        /* --------------------------------------------------------------- misc */

        chat() { toast('Opening chat with support…'); },
        callUs() { toast('Calling 1800 200 4455…'); },
        sellOnCfo() { toast('Opens the seller app — see docs/seller-app.html'); },
        soon() { toast('Not part of this prototype'); }
    };

    /* ------------------------------------------------------------- events */

    document.addEventListener('click', e => {
        const t = e.target.closest('[data-act], [data-go]');
        if (!t) return;

        // The scrim closes the sheet; a tap that merely lands inside the
        // panel bubbles up to it, so only a hit on the scrim itself counts.
        if (t.classList.contains('sheet') && e.target !== t) return;

        if (t.dataset.go) { go(t.dataset.go); return; }

        const raw = t.dataset.act;
        const cut = raw.indexOf(':');
        const name = cut === -1 ? raw : raw.slice(0, cut);
        const arg = cut === -1 ? undefined : raw.slice(cut + 1);
        if (actions[name]) actions[name](arg);
    });

    /* Search types straight into `query`; drafts type straight into the draft,
       so a re-render never loses a keystroke. */
    document.addEventListener('input', e => {
        if (e.target.matches('[data-search]')) { query = e.target.value; render(); return; }

        const el = e.target.closest('[data-bind]');
        if (!el) return;

        const key = stack[stack.length - 1];
        const draft = key === 'addrForm' ? addrDraft
            : key === 'cancelForm' ? cancelDraft
            : key === 'returnForm' ? returnDraft
            : key.startsWith('rate:') ? ratingDraft : null;

        if (draft) draft[el.dataset.bind] = el.value;
    });

    $('backBtn').addEventListener('click', back);
    $('saveBtn').addEventListener('click', () => {
        if (stack[stack.length - 1] === 'addrForm') return actions.saveAddr();
        back();
        toast('Saved');
    });
    $('searchBtn').addEventListener('click', () => {
        // Searching leaves whatever category the shopper was browsing — the
        // field is marketplace-wide, and a stuck filter reads as "no results".
        query = '';
        plp = { ...plp, category_id: null };
        go('search');
    });
    $('wishBtn').addEventListener('click', () => go('wishlist'));
    $('bellBtn').addEventListener('click', () => go('notifications'));
    $('cartBtn').addEventListener('click', () => root('cart'));

    tabbar.querySelectorAll('button').forEach(b =>
        b.addEventListener('click', () => root(b.dataset.tab)));

    render();
})();
</script>

</body>
</html>
